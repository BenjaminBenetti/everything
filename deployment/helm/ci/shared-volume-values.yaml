# Two services sharing one volume: one writes exports and the other serves them; rendered by check-stack.sh.
global:
  storageClassName: standard
sharedVolumes:
  exports:
    size: 5Gi
    storageClassName: shared-files
services:
  everything:
    volumes:
      exports: { mountPath: /exports, sharedVolume: exports }
  export-server:
    image: everything-exports
    ports:
      http: { containerPort: 8080, servicePort: 8080 }
    ingress: { port: http, paths: [/exports] }
    volumes:
      exports: { mountPath: /srv/exports, sharedVolume: exports }
      tmp: { mountPath: /tmp, emptyDir: {} }
