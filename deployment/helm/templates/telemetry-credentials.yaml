{{- /*
The password of OpenObserve's root account, which only Everything uses to send and read telemetry.
Like fleet-gateway-session.yaml, it is derived from a purpose label and the 256-bit session
encryption key, so every installation has its own without a new install-time value, and it reveals
neither. The prefix meets OpenObserve's password rules: a lower and upper case letter, a digit, and a
symbol. OpenObserve keeps the password it was first started with, so a later change of the session
encryption key needs its data reset as well; see deployment/documentation/telemetry.md.
*/ -}}
{{- $auth := required "secrets.browser-auth is required" (get .Values.secrets "browser-auth") }}
{{- $key := required "secrets.browser-auth.session-encryption-key is required" (get $auth "session-encryption-key") }}
apiVersion: v1
kind: Secret
metadata:
  # Mounted by Everything and read by OpenObserve's ZO_ROOT_USER_PASSWORD.
  name: telemetry-credentials
  labels:
    {{- include "stack.commonLabels" . | nindent 4 }}
type: Opaque
data:
  password: {{ printf "Ot1-%s" (printf "everything/telemetry/openobserve-root/v1:%s" $key | sha256sum) | b64enc | quote }}
