{{- range $name, $data := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "stack.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ required (printf "secrets.%s.%s is required" $name $key) $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
