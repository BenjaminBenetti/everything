# Development defaults for the local Minikube stack; values.prod.yaml overrides them for remote clusters.
# Env values, env secret names, and secret volume names are rendered as templates, so they can
# reference these settings, for example "{{ tpl .Values.global.publicOrigin . }}".
global:
  # Every service image is <registry>/<image>:<tag>; an empty registry uses local images, and an empty
  # tag uses the chart's appVersion, which the release workflow sets to the released version.
  image:
    registry: ""
    tag: foundation
    pullPolicy: Never
  # Origin through which browsers reach the application. Keycloak is served under /auth on it, and
  # access tokens carry it in their issuer. TLS, when used, terminates at the cluster's ingress.
  externalHostname: localhost
  publicOrigin: "http://{{ .Values.global.externalHostname }}:8080"
  # Hostname of the artifact host, which serves artifacts on an origin of their own so artifact pages
  # never share the application's. It must share the application's registrable domain, such as
  # artifacts.example.com beside everything.example.com, so its login cookie works in the app.
  externalArtifactHostname: localhost
  # Locally the artifact host is a second port on localhost: a different origin on the same site.
  artifactOrigin: "http://{{ .Values.global.externalArtifactHostname }}:8081"
  # Hostname of the public apps host, a third origin that serves apps the user has made public to
  # anyone. It is a different origin from the artifact host, so a public app's pages run under their
  # own browser trust boundary and cannot reach the artifact host's signed-in cookies or the private
  # apps served there. Locally it is a third port on localhost.
  externalPublicAppsHostname: localhost
  publicAppsOrigin: "http://{{ .Values.global.externalPublicAppsHostname }}:8082"
  # Realm defined in services/keycloak/config/everything-realm.json.
  realm: everything
  # Secret holding the `admin`, `keycloak`, `everything`, and `artifact` database role passwords.
  databaseCredentialsSecret: database-credentials
  ingress:
    # Ingress class to use; empty selects the cluster's default class.
    className: ""
    # Host to route; empty matches requests for any host.
    host: ""
    # Controller-specific settings, such as a certificate issuer.
    annotations: {}
    # Secret holding the host's TLS certificate, for controllers and issuers that take it from the
    # Ingress; empty leaves TLS to the controller's own configuration. Requires `host`.
    tlsSecretName: ""
  # The artifact host's Ingress, with the same settings; services join it with `ingress.site: artifacts`.
  artifactIngress:
    className: ""
    host: ""
    annotations: {}
    tlsSecretName: ""
  # The public apps host's Ingress, with the same settings; joined with `ingress.site: public-apps`.
  publicAppsIngress:
    className: ""
    host: ""
    annotations: {}
    tlsSecretName: ""
  # Hostname of the artifact registry, through which nodes pull artifact and Fleet images and Fleet
  # pushes its images. It is served over HTTPS by its own Ingress, so it needs a certificate the
  # nodes trust; the development stack uses a name under .test that cluster:up makes reachable.
  externalRegistryHostname: registry.everything.test
  # The registry's Ingress, with the same settings; services join it with `ingress.site: registry`.
  registryIngress:
    className: ""
    host: "{{ .Values.global.externalRegistryHostname }}"
    annotations: {}
    tlsSecretName: ""
  # Namespaces for dynamic artifacts, their image builds, and Fleet's instances. They are named after
  # the release's namespace, so each installation has its own, and templates/namespaces.yaml creates
  # them.
  artifactNamespace: "{{ .Release.Namespace }}-artifacts"
  buildNamespace: "{{ .Release.Namespace }}-builds"
  fleetNamespace: "{{ .Release.Namespace }}-fleet"
  # Storage class for persistent volumes that do not name one; empty uses the cluster's default class.
  storageClassName: ""

# Secrets the chart creates, as Secret name to key to value. Supply the values at install time:
# development uses values.dev.yaml; other environments pass a credentials file kept out of Git.
# An empty value fails the render.
secrets:
  database-credentials:
    admin: ""
    keycloak: ""
    everything: ""
    artifact: ""
  keycloak-credentials:
    admin: ""
  browser-auth:
    client-secret: ""
    session-encryption-key: ""
  # Client secret of the Keycloak service account Everything uses to call the artifact service.
  artifact-auth:
    client-secret: ""
  # Management credential used only by the artifact service to provision per-app API clients.
  app-provisioner-auth:
    client-secret: ""
  # The artifact registry's only account, used by the artifact service, build jobs, and nodes.
  registry-credentials:
    username: ""
    password: ""

# Keycloak's realm import: files/keycloak/everything-realm.json, rendered into the keycloak-realm Secret.
keycloakRealm:
  # Development only: merge files/keycloak/everything-realm.dev.json (the owner user and test clients)
  # into the realm, with these passwords and client secrets. values.dev.yaml turns it on.
  developmentSeed:
    enabled: false
    userPasswords:
      owner: ""
    clientSecrets:
      everything-bruno: ""
      everything-outsider: ""
      wrong-audience: ""

# The registry holding dynamic artifact images. templates/registry-credentials.yaml renders its
# password file and the push and pull credentials of build jobs and artifact pods.
artifactRegistry:
  # Secret under `secrets` holding the registry's `username` and `password`.
  credentialsSecret: registry-credentials
  # Address build jobs push to, inside the cluster.
  pushHost: "registry.{{ .Release.Namespace }}.svc.cluster.local:5000"
  # Address nodes pull from: the registry's Ingress.
  pullHost: "{{ .Values.global.externalRegistryHostname }}"

# Fleet (github.com/BenjaminBenetti/fleet-man) runs delegated agents in instances on the cluster.
# fleetd runs inside Everything's container, which downloads this release when it starts and checks
# each file against its pinned SHA-256 before using it.
fleet:
  version: v3.2.0-beta
  # Each release file is downloaded from <releaseUrl>/<version>/<file>.
  releaseUrl: https://github.com/BenjaminBenetti/fleet-man/releases/download
  # SHA-256 of every file Everything installs: fleetd for Everything's architecture, and the pod build
  # and tmux bundle Fleet copies into instances on nodes of either architecture. Update them together
  # with the version.
  checksums:
    fleet-linux-amd64: 4aefbbe2f23cce52ca06ed9f1d4420d3c1a1a8bf0f4fdfb6e0f31a57b1e6a20f
    fleet-linux-arm64: 2b26debefc56582063c496030d379b2fd330003807ea23083e54ebc220a7db82
    fleet-pod-linux-amd64: 2f0c16a8b152d44130f6e67b4c713a147f225f8830e9d2c3db13770ec34846b1
    fleet-pod-linux-arm64: 2788e2d966cbde804456346a62097916fc71fa88190ce808e0b2ce7f981bc414
    fleet-tmux-linux-amd64.tar.gz: a15f9be287746ab8389226ee5f117ede5bc5601c63c42284ea55655af70b282a
    fleet-tmux-linux-arm64.tar.gz: 30e19752c4d987bbdf942e147e8dcfa425c3446cff01a76b72df7129b283c39f
  # The internal gateway (services.fleet-gateway) through which teammates' `fleet` commands control
  # this fleetd: fleetd registers here, and the gateway gives clients this address with its session.
  # It is a ClusterIP Service with no Ingress; fleetd's own token, which Everything publishes to
  # teammate pods, authorizes each request. Plain h2c, like the rest of in-cluster traffic.
  gatewayUrl: "http://fleet-gateway.{{ .Release.Namespace }}.svc.cluster.local:50051"

# Upgrades from Everything: the upgrader service installs a newer released version of this chart when
# Everything asks, the way the installer does.
upgrades:
  # Where released versions of the chart are published, as an oci:// reference rendered as a
  # template. Empty turns these upgrades off, as in development, where cluster:up deploys the working tree.
  chart: ""
  # The installer's settings file, which it passes with --set-file. Each upgrade installs the new
  # version with its values.prod.yaml and these settings over them; until they are set, upgrades are off.
  settings: ""
  # Audience of the service account tokens Everything presents to the upgrader, so they are valid
  # nowhere else.
  tokenAudience: "{{ .Release.Namespace }}-upgrader"

# Telemetry: the errors, logs, and traces the Telemetry page shows. Everything exports them to the
# openobserve service under `services` and reads them back through its own API, so only Everything
# holds the storage's credentials, and each owner sees only their own records. Set
# services.openobserve.enabled to false to run without telemetry.
telemetry:
  # Days of history OpenObserve keeps. Its compactor deletes older data within a few hours of it
  # expiring. OpenObserve accepts 3 or more days; Everything allows up to 30.
  retentionDays: 7
  # Record the text of provider, SDK, and library error messages, redacted and cut to 400
  # characters, so the Telemetry page can say what a failure said. On by default; such text can
  # quote prompts and other private text, which redaction cannot reliably recognize, so set false to
  # withhold it. Categories, codes, statuses, and request IDs are recorded either way.
  includeErrorText: true
  # Record previews of content, redacted for credentials and cut to 2,000 bytes each: the message a
  # teammate turn answered, the arguments of tool calls, and SQL statements without their parameter
  # values. Unset, it follows includeErrorText, so an installation that withholds error text
  # withholds content too; set true or false to choose on its own.
  includeContent: null

# Volumes mounted by more than one service, such as files one service writes and another serves.
# Each becomes a claim named after its key, kept on uninstall; services mount it with `sharedVolume`.
# Shared storage needs an access mode and storage class that allow it, such as ReadWriteMany.
#   exports: { size: 10Gi, accessModes: [ReadWriteMany], storageClassName: <class> }
sharedVolumes: {}

# Defaults merged under every entry in `services`; an entry overrides any of them.
serviceDefaults:
  # Set false to render nothing for a service.
  enabled: true
  # Name of an image built here, combined with the global registry and tag.
  image: ""
  # Or a published image run unchanged, as a full reference such as
  # docker.io/library/postgres:17.11-bookworm. Nodes pull it when missing, whatever the global pull
  # policy, and the deploy scripts and release workflow leave it to its publisher.
  upstreamImage: ""
  # Deployment for stateless services. StatefulSet for a single owner of state, such as a database or
  # in-process agents: Kubernetes never runs two copies of its pod, even when a node stops responding.
  workload: Deployment
  replicas: 1
  # Deployments only: stop the old pod before its replacement starts.
  strategy: Recreate
  # Deploy scripts restart waves in ascending order, waiting for each to become ready.
  # 0: data stores, 1: identity, 2: applications.
  rolloutWave: 2
  # Container name; defaults to the service name.
  containerName: ""
  # Containers run as an unprivileged user with a read-only root filesystem unless the service
  # overrides these settings.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile: { type: RuntimeDefault }
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: [ALL] }
  args: []
  # Variable name to a literal value, or to `{ secretName, key }` for a Secret value.
  env: {}
  # Port name to `{ containerPort, servicePort? }`; ports with a servicePort are exposed by a Service
  # named after the service.
  ports: {}
  # Route these path prefixes, rendered as templates, to the named exposed port, on the application's
  # origin or, with `site: artifacts` or `site: registry`, on the artifact host or the registry's
  # hostname.
  #   ingress: { port: http, paths: [/v1] }
  ingress: {}
  # Kubernetes API access: namespace (rendered as a template) to RBAC rules. A service with access
  # runs with its own ServiceAccount and a Role in each namespace; others get no API token.
  apiAccess: {}
  # Cluster-wide Kubernetes API access: RBAC rules for a ClusterRole bound to the service's account.
  clusterApiAccess: []
  # Access to upgrade the release with Helm: everything the chart renders and every rule it grants
  # other services, derived by templates/service-accounts.yaml, added to the service's own access.
  releaseAccess: false
  # `startup`, `readiness`, and `liveness` probe specifications.
  probes: {}
  resources: {}
  # Volume name to `mountPath` plus exactly one source. Omit `mountPath` for a volume only sidecars mount.
  #   persistentVolume: { size, accessModes?, storageClassName? }  claim <service>-<volume>, kept on uninstall
  #   sharedVolume: <name>                                         an entry in `sharedVolumes`
  #   secret: <secret name>                                        mounted read-only
  #   files: <directory>                                           the chart's files/<directory>, mounted read-only
  #   emptyDir: {}                                                 scratch space; the root filesystem is read-only
  #   serviceAccountToken: { audience, expirationSeconds? }       the pod account's token for one audience, as `token`
  volumes: {}
  # Containers that run to completion, by name and in name order, before the main container and any
  # sidecars start, such as one that prepares a volume. Each takes the settings a sidecar takes
  # except `probes`; its `volumeMounts` are writable even where the main container's mount is not.
  initContainers: {}
  # Containers that run beside the main one for the pod's whole life, by name. Each starts before
  # the main container and stops after it, and takes `image` or `upstreamImage`, `command`, `args`,
  # `env`, `containerSecurityContext` (replacing the service's), `probes`, `resources`, and
  # `volumeMounts`, a map of the service's volume names to mount paths.
  sidecars: {}
  # Node labels the pod must be scheduled on, such as `kubernetes.io/arch: amd64` for an image built
  # for one architecture.
  nodeSelector: {}

# Each entry becomes a Deployment or StatefulSet, its persistent volume claims, a Service for exposed ports, and
# Ingress paths. To add a microservice, add an entry here and a workspace under services/ with a
# `build:image` script.
services:
  ui:
    image: everything-ui
    workload: Deployment
    env:
      PORT: "8080"
    ports:
      http: { containerPort: 8080, servicePort: 8080 }
    ingress:
      port: http
      paths: [/]
    probes:
      startup:
        httpGet: { path: /ui-health, port: http }
        failureThreshold: 20
        periodSeconds: 3
      readiness:
        httpGet: { path: /ui-health, port: http }
        periodSeconds: 5
      liveness:
        httpGet: { path: /ui-health, port: http }
        periodSeconds: 10
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { cpu: "1", memory: 256Mi }

  postgres:
    workload: StatefulSet
    rolloutWave: 0
    upstreamImage: docker.io/library/postgres:17.11-bookworm
    podSecurityContext:
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
    # The access rules in files/postgres, mounted by the `initialization` volume.
    args: [-c, hba_file=/docker-entrypoint-initdb.d/pg_hba.conf]
    env:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD:
        secretName: "{{ .Values.global.databaseCredentialsSecret }}"
        key: admin
      KEYCLOAK_DB_PASSWORD:
        secretName: "{{ .Values.global.databaseCredentialsSecret }}"
        key: keycloak
      EVERYTHING_DB_PASSWORD:
        secretName: "{{ .Values.global.databaseCredentialsSecret }}"
        key: everything
      ARTIFACT_DB_PASSWORD:
        secretName: "{{ .Values.global.databaseCredentialsSecret }}"
        key: artifact
    ports:
      postgres: { containerPort: 5432, servicePort: 5432 }
    probes:
      readiness:
        exec: { command: [pg_isready, -U, postgres] }
        periodSeconds: 5
      liveness:
        exec: { command: [pg_isready, -U, postgres] }
        initialDelaySeconds: 30
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
    volumes:
      data:
        mountPath: /var/lib/postgresql/data
        persistentVolume: { size: 2Gi }
      # Roles and databases created when the data directory is empty, and the access rules.
      initialization:
        mountPath: /docker-entrypoint-initdb.d
        files: postgres
      tmp: { mountPath: /tmp, emptyDir: {} }
      run: { mountPath: /var/run/postgresql, emptyDir: {} }

  keycloak:
    rolloutWave: 1
    image: everything-keycloak
    args: [start, --optimized, --import-realm]
    env:
      KC_DB: postgres
      KC_CACHE: local
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD:
        secretName: "{{ .Values.global.databaseCredentialsSecret }}"
        key: keycloak
      # Served under /auth (set when the image is built) behind the ingress, which forwards the
      # original scheme and host.
      KC_HOSTNAME: "{{ tpl .Values.global.publicOrigin . }}/auth"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Confidential client secret resolved by Keycloak during realm import.
      EVERYTHING_WEB_CLIENT_SECRET:
        secretName: browser-auth
        key: client-secret
      EVERYTHING_ARTIFACT_CLIENT_SECRET:
        secretName: artifact-auth
        key: client-secret
      EVERYTHING_APP_PROVISIONER_CLIENT_SECRET:
        secretName: app-provisioner-auth
        key: client-secret
      EVERYTHING_REALM: "{{ .Values.global.realm }}"
      # Temporary administrator created on first start.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD:
        secretName: keycloak-credentials
        key: admin
    ports:
      http: { containerPort: 8080, servicePort: 8080 }
      management: { containerPort: 9000 }
    # Only the realm's OpenID Connect endpoints are public. Browsers never reach Keycloak, and the
    # services call it inside the cluster, so the admin console and API, the master realm, and
    # Keycloak's own pages stay unreachable; other /auth paths fall through to the UI.
    ingress:
      port: http
      paths:
        - "/auth/realms/{{ .Values.global.realm }}/protocol/openid-connect"
        - "/auth/realms/{{ .Values.global.realm }}/.well-known"
    probes:
      startup:
        httpGet: { path: /health/started, port: management }
        failureThreshold: 60
        periodSeconds: 5
      readiness:
        httpGet: { path: /health/ready, port: management }
        periodSeconds: 5
      liveness:
        httpGet: { path: /health/live, port: management }
        periodSeconds: 15
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "2", memory: 1Gi }
    volumes:
      data: { mountPath: /opt/keycloak/data, emptyDir: {} }
      tmp: { mountPath: /tmp, emptyDir: {} }
      # Realm import rendered by the chart from keycloakRealm; Keycloak never overwrites an existing realm.
      realm: { mountPath: /opt/keycloak/data/import, secret: keycloak-realm }

  everything:
    # Agents run in this process; a second copy would run the same agents on the same files.
    workload: StatefulSet
    containerName: api
    image: everything
    # Long enough to drain requests and let in-flight Pi tool calls settle.
    terminationGracePeriodSeconds: 45
    env:
      PORT: "8080"
      OIDC_ISSUER: "{{ tpl .Values.global.publicOrigin . }}/auth/realms/{{ .Values.global.realm }}"
      OIDC_JWKS_URL: "http://keycloak:8080/auth/realms/{{ .Values.global.realm }}/protocol/openid-connect/certs"
      OIDC_AUDIENCE: everything-api
      PUBLIC_ORIGIN: "{{ tpl .Values.global.publicOrigin . }}"
      CHATGPT_REDIRECT_URI: http://127.0.0.1:8080/v1/providers/chatgpt/callback
      OIDC_PROTOCOL_URL: "http://keycloak:8080/auth/realms/{{ .Values.global.realm }}/protocol/openid-connect"
      OIDC_CLIENT_ID: everything-web
      OIDC_CLIENT_SECRET:
        secretName: browser-auth
        key: client-secret
      SESSION_ENCRYPTION_KEY:
        secretName: browser-auth
        key: session-encryption-key
      DATABASE_URL: postgresql://everything@postgres:5432/everything
      DATABASE_PASSWORD:
        secretName: "{{ .Values.global.databaseCredentialsSecret }}"
        key: everything
      PI_STATE_DIRECTORY: /state/pi
      XDG_CACHE_HOME: /state/cache
      # Each agent keeps its files in a subdirectory named by its ID, beside the folder all agents
      # share; teammate pods mount them at the same paths, so a path means the same file everywhere.
      AGENTS_DIRECTORY: /workspace
      # The installation's saved SSH keys, through Everything's relay, which lists and signs but
      # cannot change the agent. Teammate pods mount the same socket, and fleetd falls back to it.
      SSH_AUTH_SOCK: /workspace/.ssh-agent/agent.sock
      WORKSPACE_NAMESPACE: "{{ .Release.Namespace }}"
      WORKSPACE_TEMPLATE_NAME: teammate
      WORKSPACE_CLAIM_NAME: '{{ include "stack.claimName" (dict "name" "everything" "volumeName" "agents") }}'
      ARTIFACT_SERVICE_URL: http://artifact:8081
      # The artifact host as teammate pods reach it, over plain HTTP, when view_app gives them a pass.
      ARTIFACT_HOST_URL: "http://artifact.{{ .Release.Namespace }}.svc.cluster.local:8080"
      # The public apps host as teammate pods reach it; view_app opens public apps here, with no pass.
      ARTIFACT_PUBLIC_APPS_HOST_URL: "http://artifact.{{ .Release.Namespace }}.svc.cluster.local:8082"
      ARTIFACT_CLIENT_ID: everything-artifact-client
      ARTIFACT_CLIENT_SECRET:
        secretName: artifact-auth
        key: client-secret
      # fleetd runs in this container. Its home, on the fleet volume, holds its state, cluster
      # connection, Docker login, and repository checkouts.
      FLEET_HOME: /fleet
      FLEET_VERSION: "{{ .Values.fleet.version }}"
      FLEET_RELEASE_URL: "{{ .Values.fleet.releaseUrl }}"
      FLEET_CHECKSUMS: "{{ toJson .Values.fleet.checksums }}"
      FLEET_NAMESPACE: "{{ tpl .Values.global.fleetNamespace . }}"
      FLEET_STORAGE_CLASS: "{{ .Values.global.storageClassName }}"
      # Fleet pushes images to and names them by the address nodes pull them from.
      FLEET_REGISTRY: "{{ tpl .Values.artifactRegistry.pullHost . }}"
      REGISTRY_USERNAME:
        secretName: "{{ .Values.artifactRegistry.credentialsSecret }}"
        key: username
      REGISTRY_PASSWORD:
        secretName: "{{ .Values.artifactRegistry.credentialsSecret }}"
        key: password
      # Fleet builds devcontainer images with the docker sidecar's engine.
      DOCKER_HOST: unix:///run/docker-socket/docker.sock
      # Teammates' `fleet` commands reach fleetd through the internal gateway; Everything publishes
      # the address the gateway assigns and fleetd's own token to them.
      FLEET_GATEWAY_URL: "{{ tpl .Values.fleet.gatewayUrl . }}"
      # The upgrader, which accepts the token on the upgrader-token volume.
      UPGRADER_URL: http://upgrader:8080
      UPGRADER_TOKEN_FILE: /var/run/secrets/upgrader/token
      # Streaming voice input relays to the voice-asr service; empty, which turns streaming off, when
      # that service is turned off.
      VOICE_STREAM_URL: '{{ include "stack.serviceUrl" (dict "root" . "name" "voice-asr" "port" "http" "scheme" "ws" "path" "/v1/stream") }}'
      # Telemetry goes to the openobserve service; empty, which turns telemetry off, when that service
      # is turned off. The password is read from the telemetry-credentials volume, never the
      # environment, so fleetd and the commands it runs don't inherit it.
      TELEMETRY_URL: '{{ include "stack.serviceUrl" (dict "root" . "name" "openobserve" "port" "http" "scheme" "http" "path" "") }}'
      TELEMETRY_USERNAME: everything@telemetry.local
      TELEMETRY_PASSWORD_FILE: /var/run/secrets/telemetry/password
      TELEMETRY_RETENTION_DAYS: "{{ .Values.telemetry.retentionDays }}"
      TELEMETRY_INCLUDE_ERROR_TEXT: "{{ .Values.telemetry.includeErrorText }}"
      TELEMETRY_INCLUDE_CONTENT: '{{ if kindIs "bool" .Values.telemetry.includeContent }}{{ .Values.telemetry.includeContent }}{{ else }}{{ .Values.telemetry.includeErrorText }}{{ end }}'
      TELEMETRY_SERVICE_VERSION: "{{ .Chart.AppVersion }}"
    apiAccess:
      "{{ .Release.Namespace }}":
        - apiGroups: [apps]
          resources: [statefulsets]
          verbs: [get, list, create, patch, delete]
        - apiGroups: [""]
          resources: [services]
          verbs: [get, list, create, patch, delete]
        - apiGroups: [""]
          resources: [pods]
          verbs: [get, list]
      # Fleet's instances, with their jobs, caches, disks, and network policies.
      "{{ tpl .Values.global.fleetNamespace . }}":
        - apiGroups: [apps]
          resources: [statefulsets, deployments]
          verbs: [create, get, list, watch, patch, delete]
        - apiGroups: [apps]
          resources: [replicasets]
          verbs: [get, list]
        - apiGroups: [batch]
          resources: [jobs]
          verbs: [create, get, list, watch, patch, delete]
        - apiGroups: [""]
          resources: [pods]
          verbs: [create, get, list, watch, delete]
        - apiGroups: [""]
          resources: [pods/exec, pods/portforward]
          verbs: [create, get]
        - apiGroups: [""]
          resources: [pods/log]
          verbs: [get]
        - apiGroups: [""]
          resources: [events, limitranges, resourcequotas]
          verbs: [get, list]
        - apiGroups: [""]
          resources: [persistentvolumeclaims, secrets, configmaps, services]
          verbs: [create, get, list, patch, delete]
        - apiGroups: [coordination.k8s.io]
          resources: [leases]
          verbs: [create, get, update]
        - apiGroups: [networking.k8s.io]
          resources: [networkpolicies]
          verbs: [create, get, list, patch, delete]
        - apiGroups: [snapshot.storage.k8s.io]
          resources: [volumesnapshots]
          verbs: [create, get, list, delete]
        - apiGroups: [rbac.authorization.k8s.io]
          resources: [rolebindings]
          verbs: [list]
        - apiGroups: [metrics.k8s.io]
          resources: [pods]
          verbs: [list]
        - apiGroups: [policy]
          resources: [poddisruptionbudgets]
          verbs: [create, get, list, patch, delete]
    # Cluster-wide reads that let Fleet choose storage classes, see node architectures and capacity,
    # move instances off drained nodes, and recognise the cluster.
    clusterApiAccess:
      - apiGroups: [""]
        resources: [nodes, persistentvolumes, namespaces]
        verbs: [get, list, watch]
      - apiGroups: [storage.k8s.io]
        resources: [storageclasses, csinodes, csidrivers, volumeattachments]
        verbs: [get, list, watch]
      - apiGroups: [snapshot.storage.k8s.io]
        resources: [volumesnapshotclasses]
        verbs: [get, list, watch]
      - apiGroups: [node.k8s.io]
        resources: [runtimeclasses]
        verbs: [get, list, watch]
    ports:
      http: { containerPort: 8080, servicePort: 8080 }
    ingress:
      port: http
      paths: [/v1, /health]
    probes:
      startup:
        httpGet: { path: /health/live, port: http }
        failureThreshold: 40
        periodSeconds: 3
      readiness:
        httpGet: { path: /health/ready, port: http }
        periodSeconds: 5
      liveness:
        httpGet: { path: /health/live, port: http }
        periodSeconds: 10
    # The limits cover Pi, fleetd, and the devcontainer CLI and Git commands fleetd runs.
    resources:
      requests: { cpu: 100m, memory: 3Gi }
      limits: { cpu: "2", memory: 4Gi }
    volumes:
      # Pi provider credentials and model catalog.
      state:
        mountPath: /state
        persistentVolume: { size: 1Gi }
      # Files of every agent and the folder they share; agents are created at runtime, so this volume
      # is shared rather than per agent.
      agents:
        mountPath: /workspace
        persistentVolume: { size: 10Gi }
      ssh-hosts:
        mountPath: /etc/ssh/ssh_config.d
        files: ssh
      # Fleet's home: the pinned release, Fleet's state and logins, and repository checkouts.
      fleet:
        mountPath: /fleet
        persistentVolume: { size: 32Gi }
      # The docker sidecar's socket, its only listener. It's kept out of dockerd's /run/docker, whose PID
      # files would otherwise outlive a restart in this volume and stop dockerd from starting again.
      docker-socket: { mountPath: /run/docker-socket, emptyDir: {} }
      # Docker's images and build cache: mounted only by the sidecar, and rebuilt with the pod.
      docker-data: { emptyDir: {} }
      tmp: { mountPath: /tmp, emptyDir: {} }
      # Proves to the upgrader that requests come from Everything's service account.
      upgrader-token:
        mountPath: /var/run/secrets/upgrader
        serviceAccountToken:
          audience: "{{ tpl .Values.upgrades.tokenAudience . }}"
      # OpenObserve's password, rendered by templates/telemetry-credentials.yaml.
      telemetry-credentials:
        mountPath: /var/run/secrets/telemetry
        secret: telemetry-credentials
    sidecars:
      # The Docker engine fleetd builds devcontainer images with. It needs a privileged container,
      # and serves only the socket it shares with Everything's container.
      docker:
        upstreamImage: docker.io/library/docker:29.8.2-dind
        # Docker's networks default to 1500-byte packets. Pod networks that encapsulate traffic carry
        # less, such as 1450 with VXLAN, and drop larger packets, which stalls HTTPS downloads in build
        # steps. The engine takes the MTU of the pod's interface, which Kubernetes names eth0, and
        # starts through the image's entrypoint with args.
        command:
          - sh
          - -c
          - exec dockerd-entrypoint.sh "$@" --mtu="$(cat /sys/class/net/eth0/mtu)"
          - dockerd-entrypoint.sh
        args:
          [dockerd, --host=unix:///run/docker-socket/docker.sock, --group=1000]
        containerSecurityContext:
          privileged: true
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          seccompProfile: { type: Unconfined }
        probes:
          liveness:
            exec:
              {
                command:
                  [
                    docker,
                    --host=unix:///run/docker-socket/docker.sock,
                    version,
                  ],
              }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: "4", memory: 8Gi }
        volumeMounts:
          docker-socket: /run/docker-socket
          docker-data: /var/lib/docker

  # Everything copies this pod template into one singleton StatefulSet for each persisted teammate.
  # Keeping the template as a zero-replica service makes image loading and configuration generic.
  teammate:
    workload: StatefulSet
    replicas: 0
    image: everything-teammate
    terminationGracePeriodSeconds: 10
    # Reconciliation adds WORKSPACE_DIRECTORY, the teammate's own folder, and its workspace token.
    env:
      PORT: "8080"
      SSH_AUTH_SOCK: /run/ssh-agent/agent.sock
    ports:
      http: { containerPort: 8080 }
    probes:
      startup:
        httpGet: { path: /health, port: http }
        periodSeconds: 2
        failureThreshold: 30
      readiness:
        httpGet: { path: /health, port: http }
        periodSeconds: 5
      liveness:
        httpGet: { path: /health, port: http }
        periodSeconds: 10
    # Idle pods only run the workspace API; the limits leave room for compilers and a headless browser.
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: "2", memory: 2Gi }
    volumes:
      # Reconciliation substitutes the agents volume, mounting this teammate's folder at
      # /workspace/<agent id> and the shared folder at /workspace/shared, as Everything sees them.
      workspace: { mountPath: /workspace, emptyDir: {} }
      shared: { mountPath: /workspace/shared, emptyDir: {} }
      # Reconciliation mounts only the directory of Everything's SSH relay, read-only: commands can
      # list and sign with the installation's saved keys, but not add, remove, or lock them.
      ssh-agent: { mountPath: /run/ssh-agent, emptyDir: {}, readOnly: true }
      ssh-hosts:
        mountPath: /etc/ssh/ssh_config.d
        files: ssh
      # The image's `fleet` command dials the gateway address with fleetd's token, both of which
      # Everything publishes in this folder, which reconciliation mounts read-only like the SSH relay.
      fleet-client:
        { mountPath: /run/fleet-client, emptyDir: {}, readOnly: true }
      # Hide Pi's configuration and conversation files behind a read-only empty mount, which
      # reconciliation moves to /workspace/<agent id>/.pi.
      private: { mountPath: /workspace/.pi, emptyDir: {}, readOnly: true }
      # Package and build caches live here and are rebuilt after the pod is replaced. Exceeding the
      # limit evicts the pod, which clears them.
      tmp: { mountPath: /tmp, emptyDir: { sizeLimit: 4Gi } }
      # Shared memory for browsers and multiprocessing; it counts toward the memory limit.
      shm:
        mountPath: /dev/shm
        emptyDir: { medium: Memory, sizeLimit: 512Mi }

  # Fleet's gateway, run unchanged from its published image: a router to Everything's fleetd, which
  # dials out to it and keeps every Fleet state. Teammates' `fleet` commands reach fleetd through its
  # gRPC port, a ClusterIP Service with no Ingress. Its HTTP listener, which would serve Remote MCP
  # and webhooks, listens only inside its own pod. Rolling it keeps fleetd's session: fleetd
  # reconnects and the signing key resumes the same session, so the published address stays valid.
  fleet-gateway:
    upstreamImage: ghcr.io/benjaminbenetti/fleet-man/gateway:3.2.0-beta@sha256:9a077f238f85c34c1b53fe70075abbcfb96c03a167af2a917b6b408c9886180c
    env:
      FLEET_GATEWAY_GRPC_ADDR: ":50051"
      FLEET_GATEWAY_PUBLIC_GRPC_URL: "{{ tpl .Values.fleet.gatewayUrl . }}"
      FLEET_GATEWAY_PUBLIC_ADDR: "127.0.0.1:8080"
      FLEET_GATEWAY_PUBLIC_URL: http://127.0.0.1:8080
      FLEET_GATEWAY_SESSION_KEY:
        secretName: fleet-gateway-session
        key: session-key
    ports:
      grpc: { containerPort: 50051, servicePort: 50051 }
    probes:
      readiness:
        tcpSocket: { port: grpc }
        periodSeconds: 5
      liveness:
        tcpSocket: { port: grpc }
        periodSeconds: 15
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 500m, memory: 128Mi }

  registry:
    # Images are files on its disk; one copy owns them.
    workload: StatefulSet
    rolloutWave: 0
    # CNCF Distribution, configured by the REGISTRY_* variables; it runs as serviceDefaults' user, 1000.
    upstreamImage: docker.io/library/registry:3.1.2
    env:
      REGISTRY_HTTP_ADDR: ":5000"
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Everything artifacts
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      OTEL_TRACES_EXPORTER: none
    ports:
      http: { containerPort: 5000, servicePort: 5000 }
    # Nodes pull images, and Fleet pushes them, through the registry's own Ingress (see
    # artifactRegistry.pullHost); build jobs push to the Service inside the cluster.
    ingress:
      site: registry
      port: http
      paths: [/v2]
    probes:
      readiness:
        httpGet: { path: /, port: http }
        periodSeconds: 5
      liveness:
        httpGet: { path: /, port: http }
        periodSeconds: 15
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: "1", memory: 256Mi }
    volumes:
      data:
        mountPath: /var/lib/registry
        persistentVolume: { size: 10Gi }
      # Password file rendered by templates/registry-credentials.yaml.
      auth: { mountPath: /auth, secret: registry-htpasswd }

  artifact:
    # Reconciles artifact workloads and serializes each artifact's changes in process, so it runs alone.
    workload: StatefulSet
    image: everything-artifact
    env:
      PORT: "8080"
      INTERNAL_PORT: "8081"
      PUBLIC_APPS_PORT: "8082"
      PUBLIC_ORIGIN: "{{ tpl .Values.global.publicOrigin . }}"
      ARTIFACT_ORIGIN: "{{ tpl .Values.global.artifactOrigin . }}"
      PUBLIC_APPS_ORIGIN: "{{ tpl .Values.global.publicAppsOrigin . }}"
      OIDC_ISSUER: "{{ tpl .Values.global.publicOrigin . }}/auth/realms/{{ .Values.global.realm }}"
      OIDC_JWKS_URL: "http://keycloak:8080/auth/realms/{{ .Values.global.realm }}/protocol/openid-connect/certs"
      OIDC_AUDIENCE: everything-artifact
      EVERYTHING_API_URL: "http://everything.{{ .Release.Namespace }}.svc.cluster.local:8080"
      EVERYTHING_API_AUDIENCE: everything-api
      KEYCLOAK_ADMIN_URL: "http://keycloak.{{ .Release.Namespace }}.svc.cluster.local:8080/auth/admin/realms/{{ .Values.global.realm }}"
      KEYCLOAK_PROTOCOL_URL: "http://keycloak.{{ .Release.Namespace }}.svc.cluster.local:8080/auth/realms/{{ .Values.global.realm }}/protocol/openid-connect"
      APP_PROVISIONER_CLIENT_ID: everything-app-provisioner
      APP_PROVISIONER_CLIENT_SECRET:
        secretName: app-provisioner-auth
        key: client-secret
      DATABASE_URL: postgresql://artifact@postgres:5432/artifact
      DATABASE_PASSWORD:
        secretName: "{{ .Values.global.databaseCredentialsSecret }}"
        key: artifact
      # Each dynamic artifact gets a role and schema in this database, reached from its namespace.
      ARTIFACT_DATA_DATABASE: artifact_data
      ARTIFACT_DATABASE_HOST: "postgres.{{ .Release.Namespace }}.svc.cluster.local:5432"
      CONTENT_DIRECTORY: /content
      ARTIFACT_NAMESPACE: "{{ tpl .Values.global.artifactNamespace . }}"
      BUILD_NAMESPACE: "{{ tpl .Values.global.buildNamespace . }}"
      ARTIFACT_STORAGE_CLASS: "{{ .Values.global.storageClassName }}"
      REGISTRY_URL: http://registry:5000
      REGISTRY_USERNAME:
        secretName: "{{ .Values.artifactRegistry.credentialsSecret }}"
        key: username
      REGISTRY_PASSWORD:
        secretName: "{{ .Values.artifactRegistry.credentialsSecret }}"
        key: password
      REGISTRY_PUSH_HOST: "{{ tpl .Values.artifactRegistry.pushHost . }}"
      REGISTRY_PULL_HOST: "{{ tpl .Values.artifactRegistry.pullHost . }}"
      REGISTRY_PULL_SECRET: registry-pull
      REGISTRY_PUSH_SECRET: registry-push
      # Build jobs, in their own namespace, download their source from the internal port.
      BUILD_SOURCE_URL: "http://artifact.{{ .Release.Namespace }}.svc.cluster.local:8081"
      BUILDKIT_IMAGE: moby/buildkit:v0.33.1-rootless
    ports:
      # The artifact host, through the artifact Ingress.
      http: { containerPort: 8080, servicePort: 8080 }
      # The internal API, called by Everything and build jobs inside the cluster.
      internal: { containerPort: 8081, servicePort: 8081 }
      # The public apps host, through the public apps Ingress, on its own origin.
      public: { containerPort: 8082, servicePort: 8082 }
    # Two Ingresses on separate origins: the artifact host, and the public apps host.
    ingress:
      - site: artifacts
        port: http
        paths: [/]
      - site: public-apps
        port: public
        paths: [/]
    apiAccess:
      "{{ tpl .Values.global.artifactNamespace . }}":
        - apiGroups: [apps]
          resources: [deployments, statefulsets]
          verbs: [get, list, watch, create, update, patch, delete]
        - apiGroups: [""]
          resources: [services, secrets, persistentvolumeclaims]
          verbs: [get, list, watch, create, update, patch, delete]
        - apiGroups: [""]
          resources: [pods, pods/log]
          verbs: [get, list, watch]
      "{{ tpl .Values.global.buildNamespace . }}":
        - apiGroups: [batch]
          resources: [jobs]
          verbs: [get, list, watch, create, delete]
        - apiGroups: [""]
          resources: [pods, pods/log]
          verbs: [get, list, watch]
    probes:
      startup:
        httpGet: { path: /health/live, port: internal }
        failureThreshold: 40
        periodSeconds: 3
      readiness:
        httpGet: { path: /health/ready, port: internal }
        periodSeconds: 5
      liveness:
        httpGet: { path: /health/live, port: internal }
        periodSeconds: 10
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 512Mi }
    volumes:
      # Uploaded files of every revision and build source.
      content:
        mountPath: /content
        persistentVolume: { size: 10Gi }
      tmp: { mountPath: /tmp, emptyDir: {} }

  # Telemetry storage: OpenObserve (AGPL-3.0, github.com/openobserve/openobserve) run unchanged from
  # its published image, for amd64 and arm64, as one node keeping its data on its own disk. Everything
  # is its only client, through the private Service, with the root account templates/telemetry-
  # credentials.yaml derives; it has no Ingress and makes no connections outside the cluster. Set
  # `enabled: false` to run without telemetry; Everything then reports it as turned off.
  openobserve:
    # One copy owns its data directory and metadata database.
    workload: StatefulSet
    rolloutWave: 0
    upstreamImage: docker.io/openobserve/openobserve:v1.1.2@sha256:4a154849432f75c4fb024de32fe34163c02406c905dab22bf8d213d2e3386392
    terminationGracePeriodSeconds: 30
    env:
      ZO_HTTP_PORT: "5080"
      ZO_DATA_DIR: /data
      ZO_LOCAL_MODE: "true"
      ZO_LOCAL_MODE_STORAGE: disk
      ZO_COMPACT_DATA_RETENTION_DAYS: "{{ .Values.telemetry.retentionDays }}"
      # Created with the data directory; Everything's TELEMETRY_USERNAME names the same account.
      ZO_ROOT_USER_EMAIL: everything@telemetry.local
      ZO_ROOT_USER_PASSWORD:
        secretName: telemetry-credentials
        key: password
      # Nothing leaves the cluster: by default OpenObserve also reports usage to its makers and
      # downloads GeoIP databases, LLM prices, and redaction patterns from the internet.
      ZO_TELEMETRY: "false"
      ZO_MMDB_DISABLE_DOWNLOAD: "true"
      ZO_MODEL_PRICING_ENABLED: "false"
      ZO_REGEX_PATTERNS_SOURCE_URL: ""
      # Only the API Everything uses is served.
      ZO_UI_ENABLED: "false"
      ZO_SWAGGER_ENABLED: "false"
      ZO_MCP_ENABLED: "false"
      ZO_PROMETHEUS_ENABLED: "false"
      # Everything's queries, which name owners and search terms, aren't kept.
      ZO_QUERY_HISTORY_ENABLED: "false"
      # Caches and in-memory tables sized for one installation's telemetry rather than a share of the
      # node's memory; see deployment/documentation/telemetry.md for the measurements.
      ZO_MEMORY_CACHE_MAX_SIZE: "64"
      ZO_MEMORY_CACHE_DATAFUSION_MAX_SIZE: "128"
      ZO_MEM_TABLE_MAX_SIZE: "64"
      ZO_MAX_FILE_SIZE_IN_MEMORY: "16"
    ports:
      http: { containerPort: 5080, servicePort: 5080 }
    probes:
      startup:
        httpGet: { path: /healthz, port: http }
        failureThreshold: 60
        periodSeconds: 2
      readiness:
        httpGet: { path: /healthz, port: http }
        periodSeconds: 10
      liveness:
        httpGet: { path: /healthz, port: http }
        periodSeconds: 20
    # Measured at 30 MiB idle and under 100 MiB while ingesting and searching; the limit leaves room
    # for compaction and larger searches.
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: "1", memory: 768Mi }
    volumes:
      data:
        mountPath: /data
        persistentVolume: { size: 5Gi }
      tmp: { mountPath: /tmp, emptyDir: {} }

  # Speech recognition for voice input: NVIDIA's Nemotron Speech Streaming English 0.6B model on the
  # CPU (services/voice-asr), one stream at a time. Everything's voice gateway is its only client,
  # through the private Service; it has no Ingress and no token, because only pods in the cluster can
  # reach it. Set `enabled: false` to run without it, which turns streaming voice input off.
  voice-asr:
    image: everything-voice-asr
    # The native worker is built for x86-64 with AVX2, so the image exists only for amd64.
    nodeSelector: { kubernetes.io/arch: amd64 }
    # The image's user, which owns the model it downloads.
    podSecurityContext:
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
    # Leaves time to stop the native worker (VOICE_ASR_SHUTDOWN_TIMEOUT_S, 15 s).
    terminationGracePeriodSeconds: 20
    env:
      PORT: "8080"
      VOICE_ASR_MODEL_PATH: /models/nemotron-speech-streaming-en-0.6b.q8_0.gguf
      # The native worker's threads, matching the CPU limit.
      VOICE_ASR_OMP_THREAD_LIMIT: "4"
    ports:
      http: { containerPort: 8080, servicePort: 8080 }
    initContainers:
      # Downloads the pinned model into the models volume the first time, and checks its size and
      # SHA-256 at every start; the speech service only reads it. The model is licensed under the
      # NVIDIA Open Model License (services/voice-asr/MODEL_LICENSE.md), which this setting accepts.
      model:
        image: everything-voice-asr
        command: [python, -m, voice_asr.provision]
        env:
          VOICE_ASR_MODEL_PATH: /models/nemotron-speech-streaming-en-0.6b.q8_0.gguf
          VOICE_ASR_MODEL_LICENSE: NVIDIA-Open-Model-License
        resources:
          requests: { cpu: 100m, memory: 64Mi }
          limits: { cpu: "1", memory: 256Mi }
        volumeMounts:
          models: /models
    probes:
      startup:
        httpGet: { path: /healthz, port: http }
        failureThreshold: 30
        periodSeconds: 2
      # Ready after the model check, the native worker's start, and a warmup stream.
      readiness:
        httpGet: { path: /readyz, port: http }
        periodSeconds: 5
      liveness:
        httpGet: { path: /healthz, port: http }
        periodSeconds: 10
    # About 1 GiB while recognizing; there is no GPU path.
    resources:
      requests: { cpu: "1", memory: 1Gi }
      limits: { cpu: "4", memory: 3Gi }
    volumes:
      models:
        mountPath: /models
        readOnly: true
        persistentVolume: { size: 2Gi }
      tmp: { mountPath: /tmp, emptyDir: { sizeLimit: 64Mi } }

  # Installs newer released versions of this chart when Everything asks, the way the installer does.
  # It alone holds the access to change the release; it accepts requests only from Everything's
  # service account, and only to upgrade to a published version newer than the one installed. Each
  # upgrade runs as a Job with this pod's image, account, and volumes, which outlives this pod's
  # replacement during the upgrade.
  upgrader:
    image: everything-upgrader
    releaseAccess: true
    env:
      PORT: "8080"
      CHART: "{{ tpl .Values.upgrades.chart . }}"
      CURRENT_VERSION: "{{ .Chart.Version }}"
      RELEASE_NAME: "{{ .Release.Name }}"
      RELEASE_NAMESPACE: "{{ .Release.Namespace }}"
      SETTINGS_FILE: /settings/values.yaml
      TOKEN_AUDIENCE: "{{ tpl .Values.upgrades.tokenAudience . }}"
      CALLER_SERVICE_ACCOUNT: everything
      # Helm keeps its configuration, caches, and downloaded charts on the scratch volume.
      HELM_CONFIG_HOME: /tmp/helm/config
      HELM_CACHE_HOME: /tmp/helm/cache
      HELM_DATA_HOME: /tmp/helm/data
    apiAccess:
      "{{ .Release.Namespace }}":
        # Upgrade Jobs, and their pods' reasons for failing.
        - apiGroups: [batch]
          resources: [jobs]
          verbs: [get, list, create]
        - apiGroups: [""]
          resources: [pods]
          verbs: [get, list]
    clusterApiAccess:
      # Checks that a caller's token is Everything's.
      - apiGroups: [authentication.k8s.io]
        resources: [tokenreviews]
        verbs: [create]
    ports:
      http: { containerPort: 8080, servicePort: 8080 }
    probes:
      readiness:
        httpGet: { path: /health/ready, port: http }
        periodSeconds: 5
      liveness:
        httpGet: { path: /health/live, port: http }
        periodSeconds: 15
    # Upgrade Jobs run Helm with the same resources.
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: "1", memory: 512Mi }
    volumes:
      # The installer's settings, rendered by templates/upgrade-settings.yaml.
      settings: { mountPath: /settings, secret: upgrade-settings }
      tmp: { mountPath: /tmp, emptyDir: {} }
