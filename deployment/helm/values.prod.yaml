# Remote clusters: images come from a registry, and the cluster's ingress controller exposes the
# application and the artifact host. Replace the example registry, tag, and hosts. TLS for the hosts
# is configured by the cluster, for example with `global.ingress.annotations` and
# `global.artifactIngress.annotations` for a certificate issuer.
#
# Pass the credentials in a separate values file kept out of Git, with every key under `secrets` in
# values.yaml set:
#   helm upgrade everything deployment/helm --install --namespace everything \
#     --values deployment/helm/values.prod.yaml --values <credentials file>
global:
  image:
    registry: registry.example.com/everything
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  externalHostname: everything.example.com
  publicOrigin: "https://{{ .Values.global.externalHostname }}"
  # A sibling of the application's hostname, so the two are different origins on the same site.
  externalArtifactHostname: artifacts.example.com
  artifactOrigin: "https://{{ .Values.global.externalArtifactHostname }}"
  ingress:
    host: "{{ .Values.global.externalHostname }}"
  artifactIngress:
    host: "{{ .Values.global.externalArtifactHostname }}"
