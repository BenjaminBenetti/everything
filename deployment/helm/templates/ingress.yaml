{{- /*
One Ingress per site: the application's origin, the artifact host's separate origin, the public apps
host's separate origin, and the registry's hostname. A service's `ingress` is one spec or a list of
them, so a service can be reached on more than one origin.
*/ -}}
{{- $sites := dict
  "application" (dict "name" .Release.Name "settings" .Values.global.ingress)
  "artifacts" (dict "name" (printf "%s-artifacts" .Release.Name) "settings" .Values.global.artifactIngress)
  "public-apps" (dict "name" (printf "%s-public-apps" .Release.Name) "settings" .Values.global.publicAppsIngress)
  "registry" (dict "name" (printf "%s-registry" .Release.Name) "settings" .Values.global.registryIngress) }}
{{- $paths := dict }}
{{- range $name, $_ := .Values.services }}
{{- $service := include "stack.service" (dict "root" $ "name" $name) | fromYaml }}
{{- if and $service.enabled $service.ingress }}
{{- $specs := $service.ingress }}
{{- if not (kindIs "slice" $specs) }}{{- $specs = list $specs }}{{- end }}
{{- range $spec := $specs }}
{{- $site := $spec.site | default "application" }}
{{- $backend := (get $service.ports $spec.port | default dict).serviceName | default $name }}
{{- range $spec.paths }}
{{- $_ := set $paths $site (append (get $paths $site | default list) (dict "path" (tpl . $) "service" $backend "port" $spec.port)) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $site, $sitePaths := $paths }}
{{- $ingress := (get $sites $site).settings }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ (get $sites $site).name }}
  labels:
    {{- include "stack.commonLabels" $ | nindent 4 }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ tpl (required (printf "the %s Ingress needs a host for its TLS certificate" $site) $ingress.host) $ | quote }}
      secretName: {{ . }}
  {{- end }}
  rules:
    {{- if $ingress.host }}
    - host: {{ tpl $ingress.host $ | quote }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          {{- range $sitePaths }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .service }}
                port:
                  name: {{ .port }}
          {{- end }}
{{- end }}
