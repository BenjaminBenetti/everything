# Format, build, chart, and unit-test checks for main and pull requests. The release workflow calls it
# before publishing anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# The prefix differs from the release workflow's group, so a release calling this workflow does not
# wait on itself. A newer push to a pull request replaces its running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # pnpm build lints and renders the chart.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      # Voice input's decoder tests run the real FFmpeg, as the Everything image does.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg attr
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test

  # Everything's telemetry against a disposable OpenObserve container run with the chart's image,
  # settings, and limits: export, the owner-scoped query API, isolation, restart, and retention.
  telemetry:
    name: Telemetry storage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The script renders the chart to run OpenObserve as it would be deployed.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@everything/everything^..." build
      - run: pnpm test:telemetry

  # The voice-asr speech service is Python: its unit, WebSocket contract, hardening, and model
  # provisioning tests, on the Python version its image runs. The real-native suite needs the model
  # and is run by hand (services/voice-asr/README.md).
  voice-asr:
    name: Voice speech service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: bash services/voice-asr/scripts/test.sh
