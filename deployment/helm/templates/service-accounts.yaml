{{- /*
Services with `apiAccess` or `clusterApiAccess` get a ServiceAccount, a Role with its rules in each
namespace `apiAccess` names, and a ClusterRole with the `clusterApiAccess` rules.

A service with `releaseAccess` may upgrade the release with Helm. Its rules are derived here rather
than listed: every kind the chart renders, and every rule the chart grants any service, in the same
namespace or cluster-wide, because Kubernetes lets an account create a Role only with permissions it
holds itself. It can therefore do no more than the release's own resources could.
*/ -}}
{{- $granted := dict }}
{{- $grantedCluster := list }}
{{- /* The release's namespace and those templates/namespaces.yaml creates for services' workloads. */}}
{{- $releaseNamespaces := list .Release.Namespace }}
{{- range $namespace := list .Values.global.artifactNamespace .Values.global.buildNamespace .Values.global.fleetNamespace }}
{{- $releaseNamespaces = append $releaseNamespaces (tpl $namespace $) }}
{{- end }}
{{- range $name, $_ := .Values.services }}
{{- $service := include "stack.service" (dict "root" $ "name" $name) | fromYaml }}
{{- if $service.enabled }}
{{- range $namespace, $rules := $service.apiAccess }}
{{- $key := tpl $namespace $ }}
{{- $_ := set $granted $key (concat (get $granted $key | default list) $rules) }}
{{- end }}
{{- $grantedCluster = concat $grantedCluster $service.clusterApiAccess }}
{{- end }}
{{- end }}
{{- range $name, $_ := .Values.services }}
{{- $service := include "stack.service" (dict "root" $ "name" $name) | fromYaml }}
{{- if $service.enabled }}
{{- $context := dict "root" $ "name" $name }}
{{- $access := dict }}
{{- $clusterRules := $service.clusterApiAccess }}
{{- if $service.releaseAccess }}
{{- range $namespace := concat (keys $granted) $releaseNamespaces | uniq | sortAlpha }}
{{- $rules := concat (get $granted $namespace | default list) (include "stack.workloadNamespaceRules" $ | fromYamlArray) }}
{{- if eq $namespace $.Release.Namespace }}
{{- $rules = concat $rules (include "stack.releaseNamespaceRules" $ | fromYamlArray) }}
{{- end }}
{{- $_ := set $access $namespace $rules }}
{{- end }}
{{- $clusterRules = concat $grantedCluster (include "stack.clusterManagementRules" $ | fromYamlArray) }}
{{- else }}
{{- range $namespace, $rules := $service.apiAccess }}
{{- $_ := set $access (tpl $namespace $) $rules }}
{{- end }}
{{- end }}
{{- if or $access $clusterRules }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "stack.labels" $context | nindent 4 }}
{{- range $namespace, $rules := $access }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "stack.labels" $context | nindent 4 }}
rules:
  {{- toYaml $rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "stack.labels" $context | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-{{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- with $clusterRules }}
{{- /* Cluster-wide names start with the release's namespace, which no other installation shares. */}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $.Release.Namespace }}-{{ $name }}
  labels:
    {{- include "stack.labels" $context | nindent 4 }}
rules:
  {{- toYaml . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $.Release.Namespace }}-{{ $name }}
  labels:
    {{- include "stack.labels" $context | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Release.Namespace }}-{{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
