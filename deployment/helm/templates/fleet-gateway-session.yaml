{{- /*
The key Fleet's internal gateway signs session-resume tokens with, so fleetd keeps the same session,
and teammates the same address, across gateway restarts. It is the SHA-256 of a purpose label and the
256-bit session encryption key, so every installation has its own without a new install-time value,
and it reveals neither. Remote clients authenticate with fleetd's own token, which Everything
publishes to teammate pods itself, so the chart holds no Fleet client credential.
*/ -}}
{{- $auth := required "secrets.browser-auth is required" (get .Values.secrets "browser-auth") }}
{{- $key := required "secrets.browser-auth.session-encryption-key is required" (get $auth "session-encryption-key") }}
apiVersion: v1
kind: Secret
metadata:
  # Read by the fleet-gateway service's FLEET_GATEWAY_SESSION_KEY.
  name: fleet-gateway-session
  labels:
    {{- include "stack.commonLabels" . | nindent 4 }}
type: Opaque
data:
  session-key: {{ printf "everything/fleet/gateway-session-key/v1:%s" $key | sha256sum | b64enc | quote }}
