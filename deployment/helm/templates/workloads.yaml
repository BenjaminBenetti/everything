{{- range $name, $_ := .Values.services }}
{{- $service := include "stack.service" (dict "root" $ "name" $name) | fromYaml }}
{{- if $service.enabled }}
{{- $context := dict "root" $ "name" $name }}
---
apiVersion: apps/v1
kind: {{ $service.workload }}
metadata:
  name: {{ $name }}
  labels:
    {{- include "stack.labels" $context | nindent 4 }}
    # Deploy scripts restart lower waves first and wait for them to become ready.
    rollout-wave: {{ $service.rolloutWave | quote }}
spec:
  replicas: {{ $service.replicas }}
  {{- if eq $service.workload "StatefulSet" }}
  # Kubernetes starts a replacement only after the previous pod is confirmed gone, so two copies never
  # run at once; with one replica, an update stops the old pod before starting the new one.
  serviceName: {{ $name }}
  updateStrategy:
    type: RollingUpdate
  {{- else }}
  strategy:
    type: {{ $service.strategy }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "stack.selectorLabels" $context | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stack.labels" $context | nindent 8 }}
    spec:
      {{- if or $service.apiAccess $service.clusterApiAccess $service.releaseAccess }}
      # Only services granted Kubernetes API access receive a service account token.
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- with $service.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml $service.podSecurityContext | nindent 8 }}
      {{- with $service.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $service.initContainers $service.sidecars }}
      # Init containers run to completion first, in name order. Native sidecars then each start before
      # the main container and stop after it.
      initContainers:
        {{- range $containerName, $container := $service.initContainers }}
        {{- include "stack.extraContainer" (dict "root" $ "name" $name "service" $service "kind" "initContainers" "containerName" $containerName "container" $container) | nindent 8 }}
        {{- end }}
        {{- range $containerName, $container := $service.sidecars }}
        {{- include "stack.extraContainer" (dict "root" $ "name" $name "service" $service "kind" "sidecars" "containerName" $containerName "container" $container) | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $service.containerName | default $name }}
          {{- include "stack.containerImage" (dict "root" $ "name" $name "image" $service.image "upstreamImage" $service.upstreamImage) | nindent 10 }}
          {{- with $service.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml $service.containerSecurityContext | nindent 12 }}
          {{- with $service.env }}
          env:
            {{- include "stack.env" (dict "root" $ "env" .) | trim | nindent 12 }}
          {{- end }}
          {{- with $service.ports }}
          ports:
            {{- range $portName, $port := . }}
            - name: {{ $portName }}
              containerPort: {{ $port.containerPort }}
            {{- end }}
          {{- end }}
          {{- range $probe, $spec := $service.probes }}
          {{ $probe }}Probe:
            {{- toYaml $spec | nindent 12 }}
          {{- end }}
          {{- with $service.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- range $volumeName, $volume := $service.volumes }}
            {{- if $volume.mountPath }}
            - name: {{ $volumeName }}
              mountPath: {{ $volume.mountPath }}
              {{- if or $volume.secret $volume.files $volume.serviceAccountToken $volume.readOnly }}
              readOnly: true
              {{- end }}
            {{- end }}
            {{- end }}
      volumes:
        {{- range $volumeName, $volume := $service.volumes }}
        - name: {{ $volumeName }}
          {{- if $volume.persistentVolume }}
          persistentVolumeClaim:
            claimName: {{ include "stack.claimName" (dict "name" $name "volumeName" $volumeName) }}
          {{- else if $volume.sharedVolume }}
          persistentVolumeClaim:
            claimName: {{ include "stack.sharedClaimName" (dict "root" $ "service" $name "sharedVolume" $volume.sharedVolume) }}
          {{- else if $volume.secret }}
          secret:
            secretName: {{ tpl $volume.secret $ }}
            defaultMode: 288 # 0440: owner and group may read
          {{- else if $volume.files }}
          configMap:
            name: {{ include "stack.configMapName" (dict "name" $name "volumeName" $volumeName) }}
          {{- else if $volume.serviceAccountToken }}
          # A token of the pod's service account for one audience, renewed by the kubelet before it expires.
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ tpl $volume.serviceAccountToken.audience $ | quote }}
                  expirationSeconds: {{ $volume.serviceAccountToken.expirationSeconds | default 3600 }}
                  path: token
          {{- else }}
          emptyDir:
            {{- toYaml $volume.emptyDir | nindent 12 }}
          {{- end }}
        {{- end }}
{{- end }}
{{- end }}
