{{- range $name, $_ := .Values.services }}
{{- $service := include "stack.service" (dict "root" $ "name" $name) | fromYaml }}
{{- $exposed := dict }}
{{- $nodePorts := false }}
{{- range $portName, $port := $service.ports }}
{{- if $port.servicePort }}
{{- $_ := set $exposed $portName $port }}
{{- if $port.nodePort }}{{ $nodePorts = true }}{{ end }}
{{- end }}
{{- end }}
{{- if and $service.enabled $exposed }}
{{- $context := dict "root" $ "name" $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "stack.labels" $context | nindent 4 }}
spec:
  {{- if $nodePorts }}
  # A node port is reachable on every node, including through the node's own localhost.
  type: NodePort
  {{- end }}
  selector:
    {{- include "stack.selectorLabels" $context | nindent 4 }}
  ports:
    {{- range $portName, $port := $exposed }}
    - name: {{ $portName }}
      port: {{ $port.servicePort }}
      targetPort: {{ $portName }}
      {{- with $port.nodePort }}
      nodePort: {{ . }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
