{{- /*
The artifact registry's credentials in the three forms that use them: the registry's password file,
a push credential for build jobs, and a pull credential for artifact pods. Each Docker config names
the address its pods use to reach the registry.
*/ -}}
{{- $registry := .Values.artifactRegistry }}
{{- $credentials := required (printf "secrets.%s is required" $registry.credentialsSecret) (get .Values.secrets $registry.credentialsSecret) }}
{{- $username := required (printf "secrets.%s.username is required" $registry.credentialsSecret) $credentials.username }}
{{- $password := required (printf "secrets.%s.password is required" $registry.credentialsSecret) $credentials.password }}
{{- $auth := printf "%s:%s" $username $password | b64enc }}
apiVersion: v1
kind: Secret
metadata:
  # Mounted by the registry service's `auth` volume.
  name: registry-htpasswd
  labels:
    {{- include "stack.commonLabels" . | nindent 4 }}
type: Opaque
data:
  htpasswd: {{ htpasswd $username $password | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  # Mounted by build jobs to push images.
  name: registry-push
  namespace: {{ .Values.global.buildNamespace }}
  labels:
    {{- include "stack.commonLabels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict (tpl $registry.pushHost .) (dict "auth" $auth)) | toJson | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  # Named by artifact pods so nodes can pull their images.
  name: registry-pull
  namespace: {{ .Values.global.artifactNamespace }}
  labels:
    {{- include "stack.commonLabels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict (tpl $registry.pullHost .) (dict "auth" $auth)) | toJson | b64enc | quote }}
