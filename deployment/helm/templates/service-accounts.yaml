{{- /*
Services with `apiAccess` or `clusterApiAccess` get a ServiceAccount, a Role with its rules in each
namespace `apiAccess` names, and a ClusterRole with the `clusterApiAccess` rules.
*/ -}}
{{- range $name, $_ := .Values.services }}
{{- $service := include "stack.service" (dict "root" $ "name" $name) | fromYaml }}
{{- if and $service.enabled (or $service.apiAccess $service.clusterApiAccess) }}
{{- $context := dict "root" $ "name" $name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "stack.labels" $context | nindent 4 }}
{{- range $namespace, $rules := $service.apiAccess }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ tpl $namespace $ }}
  labels:
    {{- include "stack.labels" $context | nindent 4 }}
rules:
  {{- toYaml $rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ tpl $namespace $ }}
  labels:
    {{- include "stack.labels" $context | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-{{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- with $service.clusterApiAccess }}
{{- /* Cluster-wide names start with the release's namespace, which no other installation shares. */}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $.Release.Namespace }}-{{ $name }}
  labels:
    {{- include "stack.labels" $context | nindent 4 }}
rules:
  {{- toYaml . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $.Release.Namespace }}-{{ $name }}
  labels:
    {{- include "stack.labels" $context | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Release.Namespace }}-{{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
