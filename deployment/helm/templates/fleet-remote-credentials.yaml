{{- /*
Credentials of remote Fleet control through the internal gateway, each derived from the session
encryption key so every installation has its own without a new install-time value, and each in a
Secret of its own so a pod receives only the one it needs:
  - fleet-client-token: the bearer token fleetd requires of remote clients. Everything gives it to
    fleetd, and teammate pods mount it for their `fleet` command. It grants full control of Fleet.
  - fleet-gateway-session: the key the gateway signs session-resume tokens with, so fleetd keeps
    the same session, and teammates the same address, across gateway restarts.
Each is the SHA-256 of a purpose label and the 256-bit key: neither reveals the key or the other.
*/ -}}
{{- $auth := required "secrets.browser-auth is required" (get .Values.secrets "browser-auth") }}
{{- $key := required "secrets.browser-auth.session-encryption-key is required" (get $auth "session-encryption-key") }}
apiVersion: v1
kind: Secret
metadata:
  # Read by Everything's FLEET_CLIENT_TOKEN and mounted by teammate pods' `fleet-token` volume.
  name: fleet-client-token
  labels:
    {{- include "stack.commonLabels" . | nindent 4 }}
type: Opaque
data:
  token: {{ printf "everything/fleet/client-token/v1:%s" $key | sha256sum | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  # Read by the fleet-gateway service's FLEET_GATEWAY_SESSION_KEY.
  name: fleet-gateway-session
  labels:
    {{- include "stack.commonLabels" . | nindent 4 }}
type: Opaque
data:
  session-key: {{ printf "everything/fleet/gateway-session-key/v1:%s" $key | sha256sum | b64enc | quote }}
